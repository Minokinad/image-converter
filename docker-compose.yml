name: image-converter-lab8

services:
  frontend:
    build: ./client
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build: .
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:3000"
    environment:
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: image_converter_db
      MONGO_URI: mongodb://mongo:27017/image_converter_db
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-local-secret}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost,http://127.0.0.1,http://localhost:${FRONTEND_PORT:-80},http://127.0.0.1:${FRONTEND_PORT:-80}}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: image_converter_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 2s
      retries: 20

  mongo:
    image: mongo:8.0
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  mongo-data:
