$kind: http-request
name: 4. POST - Вход администратора (200 OK + автосохранение токена)
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@converter2026.com",
      "password": "admin_secret_pass_2026"
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      if (jsonData.token) {
          pm.collectionVariables.set('adminToken', jsonData.token);
          console.log('Токен администратора сохранен автоматически!');
      }
    language: text/javascript
order: 4000
